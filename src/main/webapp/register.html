<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书馆系统 - 注册</title>
    <script src="js/axios.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f4; margin: 0; }
        .register-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-size: 14px; font-weight: bold;}
        .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-submit { background: #007bff; color: white; }
        .btn-login { background: #6c757d; color: white; }
        .msg { text-align: center; font-size: 14px; margin-bottom: 10px; display: none; }
        .msg.error { color: red; }
        .msg.success { color: green; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>用户注册</h2>
    <div id="msgBox" class="msg"></div>

    <div class="form-group"><label>姓名 (登录账号)</label><input type="text" id="name" placeholder="请输入真实姓名"></div>
    <div class="form-group"><label>密码</label><input type="password" id="password" placeholder="请输入密码"></div>
    <div class="form-group"><label>手机号</label><input type="text" id="phone" placeholder="请输入11位手机号"></div>
    <div class="form-group"><label>专业</label><input type="text" id="major" placeholder="请输入专业"></div>
    <div class="form-group">
        <label>角色</label>
        <select id="role" onchange="toggleRoleFields()">
            <option value="">-- 请选择角色 --</option>
            <option value="学生">学生</option>
            <option value="教师">教师</option>
            <option value="管理员">管理员</option>
            <option value="操作员">操作员</option>
        </select>
    </div>

    <div id="dynamicFields">
        <div class="role-fields" id="fields-学生" style="display:none;">
            <div class="form-group"><label>年级</label><input type="text" id="grade"></div>
            <div class="form-group"><label>所属学院</label><input type="text" id="college_student"></div>
        </div>
        <div class="role-fields" id="fields-教师" style="display:none;">
            <div class="form-group"><label>所属学院</label><input type="text" id="college_teacher"></div>
            <div class="form-group"><label>职称</label><input type="text" id="title"></div>
        </div>
        <div class="role-fields" id="fields-管理员" style="display:none;">
            <div class="form-group"><label>权限等级</label><input type="number" id="permissionLevel"></div>
            <div class="form-group"><label>入职时间</label><input type="date" id="entryTime"></div>
        </div>
        <div class="role-fields" id="fields-操作员" style="display:none;">
            <div class="form-group"><label>负责区域</label><input type="text" id="area"></div>
            <div class="form-group"><label>职务</label><input type="text" id="duty"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-login" onclick="window.location.href='login.html'">返回登录</button>
        <button class="btn-submit" onclick="register()">立即注册</button>
    </div>
</div>

<script>
    function toggleRoleFields() {
        const role = document.getElementById('role').value;
        document.querySelectorAll('.role-fields').forEach(el => el.style.display = 'none');
        if (role) document.getElementById('fields-' + role).style.display = 'block';
    }

    function showMsg(text, isSuccess) {
        const msgBox = document.getElementById('msgBox');
        msgBox.innerText = text;
        msgBox.className = 'msg ' + (isSuccess ? 'success' : 'error');
        msgBox.style.display = 'block';
    }

    function register() {
        const name = document.getElementById('name').value.trim();
        const password = document.getElementById('password').value;
        const phone = document.getElementById('phone').value.trim();
        const major = document.getElementById('major').value.trim();
        const role = document.getElementById('role').value;

        if (!name || !password || !phone || !role) { showMsg('姓名、密码、手机号和角色为必填项', false); return; }
        if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入合法的 11 位手机号', false); return; }

        const data = { name, password, phone, major, role };
        if (role === '学生') {
            data.grade = document.getElementById('grade').value;
            data.college = document.getElementById('college_student').value;
        } else if (role === '教师') {
            data.college = document.getElementById('college_teacher').value;
            data.title = document.getElementById('title').value;
        } else if (role === '管理员') {
            data.permissionLevel = document.getElementById('permissionLevel').value;
            data.entryTime = document.getElementById('entryTime').value;
        } else if (role === '操作员') {
            data.area = document.getElementById('area').value;
            data.duty = document.getElementById('duty').value;
        }

        axios.post('api/register', data).then(res => {
            if (res.data.code === 200) {
                showMsg('注册成功！即将跳转登录...', true);
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showMsg(res.data.msg, false);
            }
        }).catch(err => showMsg('网络异常', false));
    }
</script>
</body>
</html>
