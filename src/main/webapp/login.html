<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书馆系统 - 登录</title>
    <script src="/js/axios.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .captcha-box { display: flex; justify-content: space-between; }
        .captcha-box input { width: 60%; }
        .captcha-box img { width: 35%; cursor: pointer; }
        .btn-group { display: flex; justify-content: space-between; }
        button { padding: 8px 15px; cursor: pointer; }
        .error-msg { color: red; font-size: 14px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h2 style="text-align: center;">用户登录</h2>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
        <input type="text" id="username" placeholder="请输入用户名(姓名)">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <div class="form-group captcha-box">
        <input type="text" id="captcha" placeholder="验证码">
        <img src="/api/captcha" onclick="this.src='/api/captcha?t='+new Date().getTime()" title="点击刷新">
    </div>
    <div class="btn-group">
        <button onclick="resetForm()">重置</button>
        <button onclick="login()">登录</button>
    </div>
</div>

<script>
    function resetForm() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('captcha').value = '';
        document.getElementById('errorMsg').style.display = 'none';
    }

    function login() {
        const name = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const captcha = document.getElementById('captcha').value;
        const errorMsg = document.getElementById('errorMsg');

        if (!name || !password || !captcha) {
            errorMsg.innerText = '请填写完整信息';
            errorMsg.style.display = 'block';
            return;
        }

        axios.post('/api/login', { name, password, captcha }).then(res => {
            if (res.data.code === 200) {
                // 登录成功，跳转首页
                window.location.href = '/index.html';
            } else {
                errorMsg.innerText = res.data.msg;
                errorMsg.style.display = 'block';
                // 刷新验证码
                document.querySelector('img').src = '/api/captcha?t=' + new Date().getTime();
            }
        }).catch(err => {
            errorMsg.innerText = '网络异常，请稍后再试';
            errorMsg.style.display = 'block';
        });
    }
</script>
</body>
</html>
