<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书馆系统 - 首页</title>
    <!-- 引入本地 Axios -->
    <script src="/js/axios.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .header { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .function-cards { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); width: 180px; text-align: center; cursor: pointer; transition: 0.2s; font-weight: bold; color: #333; }
        .card:hover { background: #007bff; color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="header">
    <h2 id="welcomeMsg">加载中...</h2>
    <button onclick="logout()" style="padding: 8px 15px; cursor: pointer;">退出登录</button>
</div>

<div class="function-cards" id="cardsContainer">
    <!-- 卡片由 JS 动态渲染 -->
</div>

<script>
    let currentRole = '';

    window.onload = function() {
        axios.get('/api/userInfo').then(res => {
            if (res.data.code === 200) {
                document.getElementById('welcomeMsg').innerText =
                    `欢迎您，${res.data.name} (${res.data.role})`;
                currentRole = res.data.role; // 获取到的直接是中文
                renderCards();
            } else {
                window.location.href = '/login.html';
            }
        }).catch(err => {
            console.error("获取用户信息失败", err);
            window.location.href = '/login.html';
        });
    };

    function renderCards() {
        const cardsContainer = document.getElementById('cardsContainer');
        cardsContainer.innerHTML = ''; // 清空
        let cards = [];

        // ===== 修改了这里：根据中文角色匹配功能卡 =====
        if (currentRole === '管理员') {
            cards = ['用户信息查询', '借阅记录查询', '借阅数据统计', '借书', '还书', '审阅推荐图书'];
        } else if (currentRole === '学生') {
            cards = ['借书', '还书', '个人借阅查询'];
        } else if (currentRole === '操作员') {
            cards = ['添加书籍', '查看所有书籍', '废弃图书', '编辑图书', '图书副本编辑', '借书', '还书', '个人借阅查询'];
        } else if (currentRole === '教师') {
            cards = ['借书', '还书', '个人借阅查询', '推荐图书'];
        }

        cards.forEach(text => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerText = text;
            // TODO: 后续在这里加上点击跳转页面的事件
            cardsContainer.appendChild(card);
        });
    }

    function logout() {
        // 真实项目中应请求后端清除Session，这里简化处理直接跳转
        window.location.href = '/login.html';
    }
</script>
</body>
</html>
