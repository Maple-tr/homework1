<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书馆系统 - 首页</title>
    <script src="/js/axios.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; margin: 0; }
        .header { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; color: #333; }
        .logout-btn { padding: 8px 15px; cursor: pointer; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 14px; }
        .logout-btn:hover { background: #c82333; }

        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); width: 180px; text-align: center; cursor: pointer; transition: 0.2s; font-weight: bold; color: #333; border: 2px solid transparent; user-select: none; }
        .card:hover { background: #007bff; color: #fff; transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        /* 默认隐藏所有卡片区域 */
        .card-group { display: none; flex-wrap: wrap; gap: 15px; }
    </style>
</head>
<body>
<div class="header">
    <h2 id="welcomeMsg">加载中...</h2>
    <button class="logout-btn" onclick="logout()">退出登录</button>
</div>

<!-- ================= 管理员卡片 ================= -->
<div class="card-group" id="group-管理员">
    <div class="card" onclick="go('/user_query.html')">用户信息查询</div>
    <div class="card" onclick="alert('该功能正在开发中...')">借阅记录查询</div>
    <div class="card" onclick="alert('该功能正在开发中...')">借阅数据统计</div>
    <div class="card" onclick="go('/borrow_return.html')">借书</div>
    <div class="card" onclick="go('/borrow_return.html')">还书</div>
    <div class="card" onclick="alert('该功能正在开发中...')">审阅推荐图书</div>
</div>

<!-- ================= 操作员卡片 ================= -->
<div class="card-group" id="group-操作员">
    <div class="card" onclick="go('/add_book.html')">添加书籍</div>
    <div class="card" onclick="go('/manage_book.html')">查看所有书籍</div>
    <div class="card" onclick="go('/manage_book.html')">废弃图书</div>
    <div class="card" onclick="go('/manage_book.html')">编辑图书</div>
    <div class="card" onclick="go('/manage_book.html')">图书副本编辑</div>
    <div class="card" onclick="go('/borrow_return.html')">借书</div>
    <div class="card" onclick="go('/borrow_return.html')">还书</div>
    <div class="card" onclick="go('/borrow_return.html')">个人借阅查询</div>
</div>

<!-- ================= 学生卡片 ================= -->
<div class="card-group" id="group-学生">
    <div class="card" onclick="go('/borrow_return.html')">借书</div>
    <div class="card" onclick="go('/borrow_return.html')">还书</div>
    <div class="card" onclick="go('/borrow_return.html')">个人借阅查询</div>
</div>

<!-- ================= 教师卡片 ================= -->
<div class="card-group" id="group-教师">
    <div class="card" onclick="go('/borrow_return.html')">借书</div>
    <div class="card" onclick="go('/borrow_return.html')">还书</div>
    <div class="card" onclick="go('/borrow_return.html')">个人借阅查询</div>
    <div class="card" onclick="alert('该功能正在开发中...')">推荐图书</div>
</div>

<script>
    // 页面加载时获取用户信息
    window.onload = function() {
        axios.get('/api/userInfo').then(res => {
            if (res.data.code === 200) {
                document.getElementById('welcomeMsg').innerText =
                    `欢迎您，${res.data.name} (${res.data.role})`;

                // 根据角色显示对应的 HTML 块
                const group = document.getElementById('group-' + res.data.role);
                if(group) {
                    group.style.display = 'flex';
                }
            } else {
                window.location.href = '/login.html';
            }
        }).catch(err => {
            window.location.href = '/login.html';
        });
    };

    // 通用跳转方法
    function go(url) {
        window.location.href = url;
    }

    // 退出登录
    function logout() {
        axios.get('/api/logout').then(() => {
            window.location.href = '/login.html';
        }).catch(() => {
            window.location.href = '/login.html';
        });
    }
</script>
</body>
</html>
