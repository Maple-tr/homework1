<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>推荐图书</title>
    <script src="js/axios.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .box { background: #fff; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; } .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        .btn-back { background: #6c757d; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align: center;">推荐图书</h2>
    <div class="form-group"><label>书名</label><input type="text" id="bookName"></div>
    <div class="form-group"><label>作者</label><input type="text" id="author"></div>
    <div class="form-group"><label>出版社</label><input type="text" id="publisher"></div>
    <div class="form-group"><label>价格</label><input type="number" step="0.01" id="price"></div>
    <button class="btn" onclick="submitRecommend()">提交推荐</button>
    <button class="btn btn-back" onclick="window.location.href='index.html'">返回首页</button>
</div>
<script>
    function submitRecommend() {
        const data = { bookName: document.getElementById('bookName').value, author: document.getElementById('author').value, publisher: document.getElementById('publisher').value, price: document.getElementById('price').value };
        if(!data.bookName) { alert('书名不能为空'); return; }
        axios.post('api/recommend/add', data).then(res => {
            alert(res.data.msg);
            if(res.data.code === 200) document.querySelectorAll('input').forEach(i => i.value = '');
        });
    }
</script>
</body>
</html>
